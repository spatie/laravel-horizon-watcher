name: run-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.3, 8.4, 8.5, 8.6]
        laravel: ['12.*', '13.*']
        stability: [prefer-stable]
        exclude:
          - php: 8.3
            laravel: '13.*'
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Require Pest 4 for Laravel 13
        if: matrix.laravel == '13.*' && matrix.php != '8.6'
        shell: bash
        run: composer require "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" "phpunit/phpunit:^12.0" --dev --no-interaction --no-update

      - name: Require Pest 5 for PHP 8.6
        if: matrix.laravel == '13.*' && matrix.php == '8.6'
        shell: bash
        run: composer require "pestphp/pest:^5.0" "pestphp/pest-plugin-laravel:^5.0" "phpunit/phpunit:^13.0" --dev --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest
